const QUESTIONS=bank.map(([answer,prompt,...wrong],i)=>({id:'q'+(i+1),set:Math.floor(i/5)+1,answer,prompt,options:[answer,...wrong],explanation:`${answer}: ${byWord[answer].tr}. ${byWord[answer].definition}.`,wrongReasons:Object.fromEntries(wrong.map(w=>[w,`${w} “${byWord[w].tr}” anlamındadır; cümlenin anlamına uymaz.`]))}));

const KEY='ydsem-progress-v1';const DAY=86400000;const today=()=>new Date().toISOString().slice(0,10);
function blank(){return {schema:1,words:{},exams:{},xp:0,xpAwards:{},days:{},studyMinutes:{},activity:[],settings:{weeklyGoal:5},created:today()}}
function load(){try{const p=JSON.parse(localStorage.getItem(KEY));return p&&p.schema===1?{...blank(),...p,studyMinutes:p.studyMinutes||{}}:blank()}catch{return blank()}}
let state=load();function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function wordState(id){return state.words[id]||{level:0,correct:0,wrong:0,streak:0,difficulty:2,last:null,due:today()}}
function award(key,points){if(state.xpAwards[key])return;state.xpAwards[key]=1;state.xp+=points;save()}
function record(id,good,kind='question'){const w=wordState(id),now=today();w.last=now;w.correct+=good?1:0;w.wrong+=good?0:1;w.streak=good?w.streak+1:0;w.level=good?Math.min(5,w.level+1):Math.max(0,w.level-1);w.difficulty=Math.max(1,Math.min(5,w.difficulty+(good?-.15:.4)));const intervals=[0,1,3,7,14,30];let days=good?intervals[w.level]:0;if(good&&w.streak>=3)days=Math.ceil(days*1.3);if(WORDS.find(x=>x.id===id)?.star)days=Math.max(0,Math.ceil(days*.8));w.due=new Date(Date.now()+days*DAY).toISOString().slice(0,10);state.words[id]=w;state.days[now]=(state.days[now]||0)+1;state.activity.push({date:now,id,good,kind});save();if(good)award(`correct:${kind}:${id}:${now}`,5)}
function markLearned(id,choice){const w=wordState(id);if(!w.introduced){w.introduced=today();state.words[id]=w;award(`learn:${id}`,10)}record(id,choice==='know','card')}
function dueWords(){const now=today();return WORDS.filter(w=>wordState(w.id).introduced&&wordState(w.id).due<=now).sort((a,b)=>Number(b.star)-Number(a.star))}
function examResult(key,score,total){const percent=Math.round(score/total*100);const prev=state.exams[key];state.exams[key]={best:Math.max(percent,prev?.best||0),latest:percent,date:today()};save();if(percent>=80)award(`pass:${key}`,key==='big'?250:key.startsWith('progress')?100:key.startsWith('set')?50:25);return percent}
function exportProgress(){return JSON.stringify(state,null,2)}
function importProgress(raw){const p=JSON.parse(raw);if(p?.schema!==1||typeof p.words!=='object'||typeof p.exams!=='object'||typeof p.xp!=='number')throw Error('Geçersiz yedek dosyası');state={...blank(),...p};save()}
function streak(){let d=new Date(),n=0;while(true){const k=d.toISOString().slice(0,10);if(!state.days[k]){if(n===0){d.setDate(d.getDate()-1);if(!state.days[d.toISOString().slice(0,10)])break}else break}else{n++;d.setDate(d.getDate()-1)}}return n}
function addStudyMinute(){const k=today();state.studyMinutes[k]=(state.studyMinutes[k]||0)+1;save()}

const app=document.querySelector('#app'),byEn=Object.fromEntries(WORDS.map(w=>[w.en,w]));const rand=a=>[...a].sort(()=>Math.random()-.5);let screen='home',cardIndex=0,learnSet=1,showMeaning=false,exampleIndex=0,session=null,game=null,reviewQueue=[];
const nav=[['home','⌂','Ana Sayfa'],['learn','◈','Öğren'],['games','✦','Oyunlar'],['review','↻','Tekrar'],['exams','▣','Sınavlar'],['stats','▥','İstatistikler'],['profile','⚙','Profil']];
function shell(content){app.innerHTML=`<header><div class="brand"><span class="logo">Y</span><div><b>YDSEM <em>CEPTE</em></b><small>YDS kelimeleri, kalıcı öğrenme</small></div></div><span class="header-xp">✦ ${state.xp} XP</span></header><div class="layout"><nav>${nav.map(([id,icon,label])=>`<button data-nav="${id}" class="${screen===id?'active':''}"><span>${icon}</span>${label}</button>`).join('')}</nav><main>${content}</main></div><div class="bottom-nav">${nav.slice(0,5).map(([id,icon,label])=>`<button data-nav="${id}" class="${screen===id?'active':''}"><span>${icon}</span><small>${label}</small></button>`).join('')}</div>`}
function title(kicker,heading,sub=''){return `<div class="page-title"><span class="eyebrow">${kicker}</span><h1>${heading}</h1>${sub?`<p>${sub}</p>`:''}</div>`}
function metrics(){const learned=WORDS.filter(w=>wordState(w.id).introduced).length,mastered=WORDS.filter(w=>wordState(w.id).level>=5).length,attempts=state.activity.filter(x=>x.kind!=='card');const accuracy=attempts.length?Math.round(attempts.filter(x=>x.good).length/attempts.length*100):0;return {learned,mastered,accuracy,done:Object.keys(state.exams).filter(k=>k.startsWith('set')&&state.exams[k].best>=80).length}}
function home(){const m=metrics(),due=dueWords().length; shell(`${title('GÜNLÜK PANEL','Bugün biraz daha güçlen.','Her doğru hatırlama, sınavdaki bir soruyu kolaylaştırır.')}<div class="hero"><div><span class="pill">1. hafta · Adjective Set 1</span><h2>Kelimeler zihninde<br><strong>yerini bulsun.</strong></h2><p>Yıldızlı kelimeler öncelikli. Aynı kelimeyi yeni bağlamlarda tekrar gör.</p><button class="primary" data-nav="learn">Öğrenmeye devam et →</button></div><div class="hero-orb">${m.learned}<small>öğrenilen</small></div></div><div class="metric-grid">${[['Kelime',WORDS.length],['Öğrenilen',m.learned],['Kalıcı',m.mastered],['Bugün tekrar',due],['Tamamlanan set',m.done],['Başarı',m.accuracy+'%'],['Seri',streak()+' gün'],['XP',state.xp]].map(([a,b])=>`<div class="metric"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="two"><section class="panel"><h3>Bugünün odağı</h3><p>${due?`${due} kelime tekrar için hazır.`:'Öğrenme kartlarına başlayarak tekrar kuyruğunu oluştur.'}</p><button class="secondary" data-nav="review">Tekrara git →</button></section><section class="panel"><h3>Kurs notları</h3><p>Sıfat eş anlamlıları, edatlar ve çeviri ipuçları ilk gün malzemesi olarak işlendi. Fotoğrafta yıldızı belirsiz işaretler onay bekler.</p><button class="secondary" data-nav="profile">İçeriği incele →</button></section></div>`)}
function setAvailable(n){if(n===1)return true;const prior=n%2===0?'set'+(n-1):n===3?'quiz1':n===5?'progress1':'quiz3';return (state.exams[prior]?.best||0)>=80}
function learn(){shell(`${title('ÖĞRENME YOLU','Setler','Bir sonraki aşama için her set değerlendirmesinde en az %80 başarı gerekir.')}<div class="path">${Array.from({length:8},(_,i)=>{const n=i+1,count=WORDS.filter(w=>w.set===n).length,best=state.exams['set'+n]?.best,open=setAvailable(n);return `<button class="set-card ${open?'':'locked'}" data-set="${n}" ${open?'':'disabled'}><span class="set-no">${String(n).padStart(2,'0')}</span><span><b>Set ${n}</b><small>${count} kelime · ${best===undefined?'Değerlendirilmedi':`En iyi ${best}%`}</small></span><span>${best>=80?'✓':open?'→':'🔒'}</span></button>`}).join('')}</div>`)}
function card(words,mode){if(!words.length){shell(`${title('TEKRAR','Şimdilik tamam','Bugün vadesi gelen kelime yok.')}<button class="primary" data-nav="learn">Setlere dön</button>`);return}const w=words[cardIndex%words.length],s=wordState(w.id),ex=w.examples[exampleIndex%3];shell(`${title(mode==='review'?'AKTİF TEKRAR':`SET ${learnSet}`,'Kelimeyi keşfet',`${cardIndex+1} / ${words.length} · ${w.star?'★ Sınav öncelikli':'Kurs kelimesi'}`)}<div class="progress"><i style="width:${(cardIndex+1)/words.length*100}%"></i></div><article class="flashcard"><div class="card-top"><span class="tag">${w.part} · ${w.ipa}</span><button class="icon-button" data-action="speak" aria-label="Kelimeyi seslendir">◖))</button></div><h2>${w.en}</h2><p class="definition">${w.definition}</p><div class="example"><span>BAĞLAM ${exampleIndex%3+1}/3</span><p>${ex.en}</p><button class="text-button" data-action="example">Başka bağlam ↻</button></div><button class="reveal" data-action="reveal">${showMeaning?`<b>${w.tr}</b><small>${ex.tr}</small>`:'Türkçe anlamı göster ↓'}</button><div class="synonyms"><small>EŞ ANLAMLILAR · bağlama göre yakınlık değişebilir</small><p>${w.synonyms.length?w.synonyms.map(x=>`<span>${x}</span>`).join(''):'Bu grupta eş anlamlı yok.'}</p></div><div class="card-foot"><small>Tekrar: ${s.due} · Seviye ${s.level}/5</small></div></article><div class="rating"><button data-rate="again">Tekrar Et</button><button data-rate="unsure">Kararsızım</button><button data-rate="know">Biliyorum</button></div>`)}
function openSet(n){learnSet=n;cardIndex=0;exampleIndex=0;showMeaning=false;screen='card';card(WORDS.filter(w=>w.set===n),'learn')}
function startReview(){cardIndex=0;exampleIndex=0;showMeaning=false;reviewQueue=dueWords();screen='reviewcard';card(reviewQueue,'review')}
function nextCard(choice){const rev=screen==='reviewcard',words=rev?reviewQueue:WORDS.filter(w=>w.set===learnSet);const w=words[cardIndex];if(rev)record(w.id,choice==='know','review');else markLearned(w.id,choice);cardIndex++;showMeaning=false;exampleIndex=0;if(cardIndex>=words.length){screen=rev?'review':'learn';if(rev)review();else shell(`${title('SET TAMAMLANDI','Şimdi kendini sına','Setin açılması için değerlendirmede en az %80 al.')}<button class="primary" data-exam="set${learnSet}">Set ${learnSet} değerlendirmesi →</button><button class="secondary" data-nav="learn">Setlere dön</button>`)}else card(words,rev?'review':'learn')}
function review(){const due=dueWords();shell(`${title('ARALIKLI TEKRAR','Bugünkü tekrar','Yanlışlar bugün yeniden gelir; doğru yanıtlar giderek daha uzun aralıklarla döner.')}<section class="panel"><h2>${due.length} kelime hazır</h2><p>Yıldızlı kelimeler önce gelir. Diğerleri de sırada kalır.</p><button class="primary" data-action="start-review" ${due.length?'':'disabled'}>Tekrara başla →</button></section>`)}
function examDefs(){return [...Array.from({length:8},(_,i)=>{const n=i+1;return {key:'set'+n,name:`Set ${n} Değerlendirmesi`,n:5,requires:n===1?null:n%2===0?'set'+(n-1):n===3?'quiz1':n===5?'progress1':'quiz3',source:[n]}}),...Array.from({length:4},(_,i)=>({key:'quiz'+(i+1),name:`Quiz ${i+1}`,n:10,requires:'set'+((i+1)*2),source:[i*2+1,i*2+2]})),{key:'progress1',name:'Progress Test 1',n:20,requires:'quiz2',source:[1,2,3,4]},{key:'progress2',name:'Progress Test 2',n:40,requires:'quiz4',source:[1,2,3,4,5,6,7,8]},{key:'big',name:'Big Exam',n:40,requires:'progress2',source:[1,2,3,4,5,6,7,8]}]}
function isOpen(d){return !d.requires||(state.exams[d.requires]?.best||0)>=80}
function exams(){shell(`${title('SINAV MERKEZİ','Bilgini ölç','Her soruda tek doğru seçenek ve açıklamalı cevap anahtarı vardır.')}<div class="exam-grid">${examDefs().map(d=>`<button class="exam-card" data-exam="${d.key}" ${isOpen(d)?'':'disabled'}><span>${isOpen(d)?'◈':'🔒'}</span><b>${d.name}</b><small>${d.n} soru · ${state.exams[d.key]?.best===undefined?'Henüz çözülmedi':`En iyi ${state.exams[d.key].best}%`}</small></button>`).join('')}</div>`)}
function startExam(key){const d=examDefs().find(x=>x.key===key);if(!d||!isOpen(d))return;const pool=QUESTIONS.filter(q=>d.source.includes(q.set));session={key,title:d.name,questions:rand(pool).slice(0,d.n).map(q=>({...q,shuffled:rand(q.options)})),index:0,score:0,chosen:null};screen='quiz';quiz()}
function quiz(){const q=session.questions[session.index],selected=session.chosen;shell(`${title(session.title,`Soru ${session.index+1} / ${session.questions.length}`,'Doğru cevabı işaretle, ardından açıklamayı incele.')}<div class="progress"><i style="width:${(session.index+1)/session.questions.length*100}%"></i></div><section class="question"><h2>${q.prompt.replace('_____','<span>_____</span>')}</h2><div class="options">${q.shuffled.map((o,i)=>`<button data-choice="${o}" ${selected?'disabled':''} class="${selected?(o===q.answer?'correct':o===selected?'wrong':''):''}"><span>${'ABCD'[i]}</span>${o}</button>`).join('')}</div>${selected?`<div class="explanation"><b>${selected===q.answer?'Doğru!':'Doğru cevap: '+q.answer}</b><p>${q.explanation}</p>${q.options.filter(x=>x!==q.answer).map(x=>`<small>${x}: ${q.wrongReasons[x]}</small>`).join('')}</div><button class="primary" data-action="next-question">${session.index+1===session.questions.length?'Sonucu gör':'Sonraki soru →'}</button>`:''}</section>`)}

function games(){shell(`${title('MİNİ OYUNLAR','Oynayarak hatırla','Her oyun farklı bir hatırlama yolu kullanır.')}<div class="game-grid">${[['syn','Eş Anlamlı Avı','Birden fazla doğru eş anlamlıyı bul.'],['memory','Hafıza Kartları','İngilizce ve Türkçe çiftleri eşleştir.'],['sentence','Cümle Tamamlama','YDS bağlamında doğru kelimeyi seç.'],['recall','Kelimeyi Hatırla','İngilizce kelimeyi kendin yaz.'],['speed','Hızlı Cevap','İsteğe bağlı süre ile seri sorular.']].map(([id,name,desc])=>`<button class="game-card" data-game="${id}"><span>✦</span><b>${name}</b><small>${desc}</small></button>`).join('')}</div>`)}
function startGame(id){game={id,round:0,score:0,selected:[],pairs:[],flipped:[],matched:[],timer:null};screen='game';if(id==='sentence'){startExam('set1');session.key='game:sentence';session.title='Cümle Tamamlama';return}if(id==='speed'){game.limit=0}gameView()}
function gameView(){if(game.id==='syn')return synonymGame();if(game.id==='memory')return memoryGame();if(game.id==='recall')return recallGame();if(game.id==='speed')return speedGame()}
function synonymGame(){const w=WORDS.filter(x=>x.synonyms.length>=2)[game.round%WORDS.filter(x=>x.synonyms.length>=2).length],correct=w.synonyms.slice(0,2),wrong=WORDS.filter(x=>x.group!==w.group).slice(game.round*2,game.round*2+3).map(x=>x.en),opts=rand([...correct,...wrong]);game.current={w,correct,opts};shell(`${title('EŞ ANLAMLI AVI',w.en,'Tam 2 doğru eş anlamlı seç.')}<div class="options">${opts.map(x=>`<button data-syn="${x}" class="${game.selected.includes(x)?'selected':''}">${x}</button>`).join('')}</div><button class="primary" data-action="check-syn" ${game.selected.length===2?'':'disabled'}>Kontrol et</button><p class="muted">Tur ${game.round+1}/5</p>`)}

function recallGame(){const w=WORDS[(game.round*7+2)%WORDS.length];game.current=w;shell(`${title('KELİMEYİ HATIRLA',w.tr,`İpucu: ${w.definition}`)}<section class="panel"><label for="recall">İngilizce kelime</label><input id="recall" autocomplete="off" spellcheck="false" placeholder="Cevabını yaz"><button class="primary" data-action="check-recall">Kontrol et</button><div id="feedback"></div></section><p class="muted">Tur ${game.round+1}/5</p>`)}
function speedGame(){const w=WORDS[(game.round*11+4)%WORDS.length];game.current=w;game.options=rand([w,...WORDS.filter(x=>x.group!==w.group).slice(game.round*3,game.round*3+3)]);shell(`${title('HIZLI CEVAP',w.tr,'Doğru İngilizce kelimeyi seç.')}<div class="options">${game.options.map(o=>`<button data-speed="${o.en}">${o.en}</button>`).join('')}</div><p class="muted">Tur ${game.round+1}/10 · ${game.score} doğru</p><label class="toggle"><input type="checkbox" id="timed" ${game.limit?'checked':''}> 15 saniyelik süreli mod</label>`);if(game.limit)game.timer=setTimeout(()=>{if(screen==='game'&&game.id==='speed'){record(game.current.id,false,'speed');gameNext(10)}},15000)}
function gameNext(max){if(game.timer)clearTimeout(game.timer);game.timer=null;game.round++;game.selected=[];if(game.round>=max){shell(`${title('OYUN BİTTİ',`${game.score} / ${max}`,'Tekrar denemek hatırlamayı güçlendirir.')}<button class="primary" data-nav="games">Oyunlara dön</button>`);return}gameView()}
function stats(){const m=metrics(),worst=WORDS.map(w=>({w,s:wordState(w.id)})).filter(x=>x.s.wrong).sort((a,b)=>b.s.wrong-a.s.wrong).slice(0,6),days=Array.from({length:7},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));const k=d.toISOString().slice(0,10);return {k,n:state.days[k]||0}});shell(`${title('İLERLEME','İstatistikler','Gelişimini kelime ve sınav düzeyinde izle.')}<div class="metric-grid">${[['Toplam kelime',WORDS.length],['Öğrenilen',m.learned],['Kalıcı',m.mastered],['Başarı',m.accuracy+'%'],['XP',state.xp],['Haftalık süre',Object.entries(state.studyMinutes||{}).filter(([k])=>days.some(d=>d.k===k)).reduce((n,[,v])=>n+v,0)+' dk']].map(([a,b])=>`<div class="metric"><b>${b}</b><span>${a}</span></div>`).join('')}</div><div class="two"><section class="panel"><h3>Son 7 gün etkinliği</h3><div class="bars">${days.map(x=>`<div title="${x.k}: ${x.n} etkinlik"><i style="height:${Math.max(6,Math.min(100,x.n*12))}%"></i><small>${x.k.slice(5)}</small></div>`).join('')}</div></section><section class="panel"><h3>En çok hata yapılanlar</h3>${worst.length?worst.map(x=>`<div class="listline"><b>${x.w.en}</b><span>${x.s.wrong} hata</span></div>`).join(''):'Henüz hata kaydı yok.'}</section></div><section class="panel"><h3>Başarı rozetleri</h3><div class="badge-row">${[["İlk adım",m.learned>=1],["10 kelime",m.learned>=10],["7 gün seri",streak()>=7],["İlk set",m.done>=1],["Usta",m.mastered>=10]].map(([name,done])=>`<span class="badge ${done?"earned":""}">${done?"★":"☆"} ${name}</span>`).join("")}</div></section><section class="panel"><h3>Set başarıları</h3>${Array.from({length:8},(_,i)=>`<div class="listline"><span>Set ${i+1}</span><b>${state.exams['set'+(i+1)]?.best??'—'}${state.exams['set'+(i+1)]?.best!==undefined?'%':''}</b></div>`).join('')}</section>`)}
function profile(){const uncertain=['Kitap fotoğrafındaki silik yıldız izleri','El yazısı notlarda yıldız sayısı ve vurgular'];shell(`${title('PROFİL','Ayarlar ve içerik','İlerleme bu tarayıcıda saklanır; düzenli yedek al.')}<div class="two"><section class="panel"><h3>Haftalık hedef</h3><p>Çalışma günü hedefi</p><input type="number" id="goal" min="1" max="7" value="${state.settings.weeklyGoal||5}"><button class="secondary" data-action="save-goal">Kaydet</button></section><section class="panel"><h3>Veri yedeği</h3><button class="secondary" data-action="export">Yedeği indir</button><label class="file-label">Yedek yükle<input type="file" id="import" accept="application/json"></label></section></div><section class="panel"><h3>İçerik incelemesi</h3><p>${WORDS.length} sıfat, 8 set, 40 açıklamalı soru. Yıldız işaretleri fotoğrafta net görülenlerle sınırlı olarak işlendi.</p><p class="muted">Onay bekleyenler: ${uncertain.join('; ')}. Bir sonraki içerik güncellemesinde bu işaretler elle doğrulanmalı.</p></section><section class="panel"><h3>Kurs notlarından</h3><p>Edatlar: in, of, for, over, to, among, between, across, about, at, along, during, on, around, with.</p><p>İpuçları: sıfat çoğunlukla isimden önce gelir; “during” süreç/olay, “for” süre ile kullanılır. Bu notlar yeni sınav sorusu havuzuna eklenmeden ayrıca doğrulanacaktır.</p></section>`)}
function route(id){screen=id;if(id==='home')home();else if(id==='learn')learn();else if(id==='review')review();else if(id==='games')games();else if(id==='exams')exams();else if(id==='stats')stats();else if(id==='profile')profile()}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.nav)return route(b.dataset.nav);if(b.dataset.set)return openSet(Number(b.dataset.set));if(b.dataset.exam)return startExam(b.dataset.exam);if(b.dataset.rate)return nextCard(b.dataset.rate);if(b.dataset.choice&&session){const q=session.questions[session.index];if(session.chosen)return;session.chosen=b.dataset.choice;const good=session.chosen===q.answer;if(good)session.score++;record(byEn[q.answer].id,good,'exam');quiz();return}if(b.dataset.game)return startGame(b.dataset.game);if(b.dataset.syn){game.selected=game.selected.includes(b.dataset.syn)?game.selected.filter(x=>x!==b.dataset.syn):game.selected.length<2?[...game.selected,b.dataset.syn]:game.selected;synonymGame();return}if(b.dataset.flip){const i=Number(b.dataset.flip),p=game.pairs[i];if(game.flipped.includes(i)||game.matched.includes(p.key)||game.flipped.length>=2)return;game.flipped.push(i);memoryGame();if(game.flipped.length===2){const [a,z]=game.flipped.map(j=>game.pairs[j]);setTimeout(()=>{if(a.key===z.key){game.matched.push(a.key);game.score++;record(a.key,true,'memory')}else{record(a.key,false,'memory');record(z.key,false,'memory')}game.flipped=[];memoryGame()},650)}return}if(b.dataset.speed){const good=b.dataset.speed===game.current.en;game.score+=good?1:0;record(game.current.id,good,'speed');gameNext(10);return}switch(b.dataset.action){case 'speak':{const w=screen==='reviewcard'?reviewQueue[cardIndex]:WORDS.filter(x=>x.set===learnSet)[cardIndex];if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(w.en);u.lang='en-US';speechSynthesis.speak(u)}break}case 'example':exampleIndex++;card(screen==='reviewcard'?reviewQueue:WORDS.filter(w=>w.set===learnSet),screen==='reviewcard'?'review':'learn');break;case 'reveal':showMeaning=true;card(screen==='reviewcard'?reviewQueue:WORDS.filter(w=>w.set===learnSet),screen==='reviewcard'?'review':'learn');break;case 'start-review':startReview();break;case 'next-question':session.index++;session.chosen=null;if(session.index>=session.questions.length)finishExam();else quiz();break;case 'check-syn':{const good=game.selected.length===2&&game.selected.every(x=>game.current.correct.includes(x));game.score+=good?1:0;record(game.current.w.id,good,'syn');gameNext(5);break}case 'check-recall':{const value=document.querySelector('#recall').value.trim().toLowerCase(),good=value===game.current.en;game.score+=good?1:0;record(game.current.id,good,'recall');document.querySelector('#feedback').innerHTML=`<p>${good?'Doğru!':'Doğru kelime: '+game.current.en}</p><button class="secondary" data-action="next-game">Devam →</button>`;b.disabled=true;break}case 'next-game':gameNext(5);break;case 'restart-game':game.pairs=[];game.matched=[];game.flipped=[];game.score=0;memoryGame();break;case 'save-goal':state.settings.weeklyGoal=Math.max(1,Math.min(7,Number(document.querySelector('#goal').value)||5));save();profile();break;case 'export':{const blob=new Blob([exportProgress()],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ydsem-yedek.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break}}});
app.addEventListener('change',async e=>{if(e.target.id==='import'){try{const raw=await e.target.files[0].text();importProgress(raw);alert('Yedek yüklendi.');profile()}catch(err){alert(err.message)}}if(e.target.id==='timed'){game.limit=e.target.checked?15:0;if(game.timer)clearTimeout(game.timer);game.timer=null;if(game.limit)game.timer=setTimeout(()=>{if(screen==='game'&&game.id==='speed'){record(game.current.id,false,'speed');gameNext(10)}},15000)}});
if(validateQuestions().length)console.error('Question bank conflicts',validateQuestions());route('home');if(typeof window!=='undefined')setInterval(()=>{if(document.visibilityState==='visible')addStudyMinute()},60000);if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./service-worker.js');


</script></body></html>
